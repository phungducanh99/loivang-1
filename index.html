<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời vàng thầy tôi - Phần 2</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0404 0%, #1c0c0c 100%);
            --card-bg: rgba(35, 15, 15, 0.7);
            --border-color: rgba(212, 175, 55, 0.25);
            --gold-accent: #d4af37;
            --text-main: #f7f1e5;
            --text-sub: #c7bba8;
            --correct: #2e7d32;
            --incorrect: #a61c1c;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: var(--font-title);
            color: var(--gold-accent);
            margin-bottom: 15px;
            font-size: 2.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-family: var(--font-title);
            letter-spacing: 1px;
        }

        .question-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .level-badge {
            position: absolute;
            top: -14px;
            right: 30px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            backdrop-filter: blur(4px);
            border: 1px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .level-easy {
            background: rgba(76, 175, 80, 0.2);
            border-color: rgba(76, 175, 80, 0.5);
            color: #81C784;
        }

        .level-medium {
            background: rgba(255, 152, 0, 0.2);
            border-color: rgba(255, 152, 0, 0.5);
            color: #FFB74D;
        }

        .level-hard {
            background: rgba(244, 67, 54, 0.2);
            border-color: rgba(244, 67, 54, 0.5);
            color: #E57373;
        }

        .question-title {
            font-family: var(--font-title);
            font-size: 1.6rem;
            margin-top: 10px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 24px;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }

        .option-btn:focus-visible {
            outline: 2px solid var(--gold-accent);
            outline-offset: 2px;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: rgba(46, 125, 50, 0.4);
            border-color: var(--correct);
            box-shadow: 0 0 15px rgba(46, 125, 50, 0.4);
            color: #ffffff;
        }

        .option-btn.incorrect {
            background: rgba(166, 28, 28, 0.4);
            border-color: var(--incorrect);
            box-shadow: 0 0 15px rgba(166, 28, 28, 0.4);
            color: #ffffff;
        }

        .explanation {
            margin-top: 30px;
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.5);
            border-left: 4px solid var(--gold-accent);
            border-radius: 0 10px 10px 0;
            color: var(--text-sub);
            line-height: 1.6;
            font-size: 1.05rem;
            overflow: hidden;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .map-toggle-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            color: var(--gold-accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-toggle-btn:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
            transform: translateY(-1px);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: rgba(28, 12, 12, 0.95);
            border: 1px solid var(--gold-accent);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            color: var(--text-main);
            position: relative;
        }

        .modal-title {
            font-family: var(--font-title);
            color: var(--gold-accent);
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .modal-text {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 20px;
            font-family: var(--font-title);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .modal-btn-primary {
            background: var(--gold-accent);
            color: #1a0808;
            border: 1px solid var(--gold-accent);
        }

        .modal-btn-primary:hover {
            background: #e5be3b;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-1px);
        }

        .modal-btn-secondary {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
        }

        .modal-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-color: var(--text-sub);
        }

        /* Quiz Map Modal Specifics */
        .quiz-map-content {
            max-width: 720px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 25px;
            text-align: left;
        }

        .quiz-map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .quiz-map-header .modal-title {
            margin: 0;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: var(--gold-accent);
        }

        .quiz-map-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.unanswered {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dot.correct {
            background: #10b981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
        }

        .dot.incorrect {
            background: #e11d48;
            box-shadow: 0 0 6px rgba(225, 29, 72, 0.6);
        }

        .dot.current {
            background: transparent;
            border: 2px solid var(--gold-accent);
            box-shadow: 0 0 6px var(--gold-accent);
        }

        .quiz-map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 8px;
            overflow-y: auto;
            max-height: 55vh;
            padding-right: 5px;
        }

        .quiz-map-grid::-webkit-scrollbar {
            width: 6px;
        }
        .quiz-map-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .quiz-map-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .grid-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-body);
        }

        .grid-item.unanswered {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grid-item.unanswered:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-accent);
            color: var(--text-main);
            transform: scale(1.08);
        }

        .grid-item.correct {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
        }

        .grid-item.correct:hover {
            background: rgba(16, 185, 129, 0.35);
            transform: scale(1.08);
        }

        .grid-item.incorrect {
            background: rgba(225, 29, 72, 0.2);
            color: #f87171;
            border: 1px solid rgba(225, 29, 72, 0.5);
            box-shadow: 0 0 8px rgba(225, 29, 72, 0.2);
        }

        .grid-item.incorrect:hover {
            background: rgba(225, 29, 72, 0.35);
            transform: scale(1.08);
        }

        .grid-item.current {
            border: 2px solid var(--gold-accent) !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6) !important;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
                transform: translateY(-10px);
                padding-top: 0;
                padding-bottom: 0;
            }
            to {
                opacity: 1;
                max-height: 500px;
                transform: translateY(0);
                padding-top: 20px;
                padding-bottom: 20px;
            }
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: var(--font-title);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            color: var(--gold-accent);
        }

        .nav-btn:focus-visible {
            outline: 2px solid var(--gold-accent);
            outline-offset: 2px;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .result-title {
            font-family: var(--font-title);
            color: var(--gold-accent);
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .chart-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
        }

        .donut-chart {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .donut-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 12;
        }

        .donut-progress {
            fill: none;
            stroke: var(--gold-accent);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 502.65; /* 2 * PI * r = 2 * 3.14159 * 80 ~ 502.65 */
            stroke-dashoffset: 502.65;
            transition: stroke-dashoffset 1.5s ease-out;
        }

        .chart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .result-badge {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 15px;
            font-family: var(--font-title);
        }

        .result-message {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 25px;
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--gold-accent);
            color: #1a0808;
            border: 1px solid var(--gold-accent);
        }

        .btn-primary:hover {
            background: #e5be3b;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-accent);
            transform: translateY(-2px);
        }

        /* Review Banner */
        .review-banner {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-accent);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
        
        .review-banner button {
            background: var(--gold-accent);
            color: #1a0808;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        
        .review-banner button:hover {
            background: #e5be3b;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* Timer styles */
        .timer-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--gold-accent), var(--incorrect));
            transition: width 0.1s linear, background-color 0.3s ease;
            border-radius: 3px;
        }

        .timer-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-title);
            font-size: 1.05rem;
            color: var(--gold-accent);
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        /* Timeout Overlay styles */
        .options-container {
            position: relative;
            width: 100%;
        }

        .timeout-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(35, 10, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 1px dashed var(--gold-accent);
            box-shadow: 0 0 25px rgba(166, 28, 28, 0.3);
            animation: fadeIn 0.4s ease;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }

        .timeout-title {
            font-family: var(--font-title);
            color: var(--incorrect);
            font-size: 1.4rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(166, 28, 28, 0.6);
        }

        .timeout-subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            font-family: var(--font-body);
        }

        @media (max-width: 600px) {
            .app-container {
                margin: 20px auto;
                padding: 15px;
            }
            .header h1 {
                font-size: 1.7rem;
            }
            .question-title {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
            .question-card {
                padding: 25px 20px;
            }
            .option-btn {
                font-size: 1rem;
                padding: 14px 18px;
            }
            .level-badge {
                right: 20px;
            }
            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .progress-bar {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }
            .quiz-map-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Cấu trúc HTML chính -->
    </div>

    <!-- Modal Auto-Save / Resume -->
    <div id="resume-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title">Khôi Phục Tiến Trình</h3>
            <p class="modal-text">Bạn có muốn tiếp tục làm bài trắc nghiệm từ câu hỏi trước đó không?</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-primary" onclick="confirmResume(true)">Đồng ý</button>
                <button class="modal-btn modal-btn-secondary" onclick="confirmResume(false)">Làm lại từ đầu</button>
            </div>
        </div>
    </div>

    <!-- Modal Quiz Map -->
    <div id="quiz-map-modal" class="modal-overlay" style="display: none;" onclick="closeQuizMapOnBackdrop(event)">
        <div class="modal-content quiz-map-content">
            <div class="quiz-map-header">
                <h3 class="modal-title">🗺️ Bản Đồ Câu Hỏi (100 Câu)</h3>
                <button class="close-btn" onclick="closeQuizMap()">&times;</button>
            </div>
            <div class="quiz-map-legend">
                <span class="legend-item"><span class="dot unanswered"></span> Chưa trả lời</span>
                <span class="legend-item"><span class="dot correct"></span> Trả lời đúng</span>
                <span class="legend-item"><span class="dot incorrect"></span> Trả lời sai</span>
                <span class="legend-item"><span class="dot current"></span> Câu hiện tại</span>
            </div>
            <div id="quiz-map-grid" class="quiz-map-grid">
                <!-- Thẻ grid item được render bằng Javascript -->
            </div>
        </div>
    </div>
    <script>
const quizData = [
    {
        "level": "medium",
        "question": "1. Theo tác phẩm 'Lời Vàng Của Thầy Tôi', ba loại niềm tin khi đến với Tam Bảo được phân loại cụ thể là gì?",
        "options": [
            "Niềm tin thanh tịnh, niềm tin lý trí và niềm tin kiên cố",
            "Niềm tin sống động, niềm tin tha thiết và niềm tin kiên định",
            "Niềm tin ban đầu, niềm tin trung gian và niềm tin cứu kính",
            "Niềm tin củng cố, niềm tin phát nguyện và niềm tin hoàn hảo"
        ],
        "correct": 1,
        "explanation": "Phần 2, Chương 1: Ba loại tín tâm khi quy y gồm Niềm tin sống động (vivid faith), Niềm tin tha thiết (eager faith) và Niềm tin kiên định (firm faith)."
    },

// Biến trạng thái toàn cục & LocalStorage
const STORAGE_KEY = 'quiz_loi_vang_p2_state';
let currentQuestion = 0;
let score = 0;
let userAnswers = new Array(quizData.length).fill(null);
let savedStateTemp = null;
let showResult = false;
let isReviewMode = false;
let timerInterval = null;
let timeLeft = 20;
let isExplanationRevealed = false;

function saveState() {
    try {
        const state = {
            currentQuestion,
            score,
            userAnswers,
            showResult,
            isReviewMode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.error("Lỗi khi lưu trạng thái vào LocalStorage:", e);
    }
}

function updateScore() {
    score = userAnswers.reduce((acc, ans, idx) => {
        return (ans !== null && ans === quizData[idx].correct) ? acc + 1 : acc;
    }, 0);
}

function renderResultScreen() {
    const app = document.querySelector('.app-container');
    if (!app) return;
    
    const percentage = (score / quizData.length) * 100;
    
    let title = "";
    let message = "";
    
    if (percentage >= 90) {
        title = "Bậc Thượng Căn";
        message = "Trí tuệ thấu suốt sâu sắc. Bạn đã nắm vững cốt lõi giáo lý một cách phi thường.";
    } else if (percentage >= 70) {
        title = "Bậc Trung Căn";
        message = "Hiểu biết sâu rộng giáo lý. Bạn có nền tảng học pháp rất tốt.";
    } else if (percentage >= 50) {
        title = "Bậc Hạ Căn";
        message = "Nền tảng khá vững chắc. Hãy tiếp tục tinh tấn tu học thêm.";
    } else {
        title = "Người Mới Bắt Đầu";
        message = "Cần tiếp tục đọc và quán chiếu sâu hơn. Đừng nản lòng, con đường học pháp luôn rộng mở.";
    }
    
    const dashoffset = 502.65 - (502.65 * percentage) / 100;
    
    app.innerHTML = `
        <div class="question-card result-screen">
            <h1 class="result-title">Kết Quả Tu Học</h1>
            <div class="chart-container">
                <svg class="donut-chart" viewBox="0 0 200 200">
                    <circle class="donut-bg" cx="100" cy="100" r="80"></circle>
                    <circle class="donut-progress" cx="100" cy="100" r="80" style="stroke-dashoffset: 502.65;"></circle>
                </svg>
                <div class="chart-text">${score} / ${quizData.length}</div>
            </div>
            <div class="result-badge">${title}</div>
            <div class="result-message">${message}</div>
            <div class="result-actions">
                <button class="btn btn-secondary" onclick="startReviewMode()">Xem lại đáp án</button>
                <button class="btn btn-primary" onclick="restartQuiz()">Làm lại từ đầu</button>
            </div>
        </div>
    `;
    
    setTimeout(() => {
        const progressCircle = document.querySelector('.donut-progress');
        if (progressCircle) {
            progressCircle.style.strokeDashoffset = dashoffset;
        }
    }, 100);
}

function finishQuiz() {
    showResult = true;
    isReviewMode = false;
    saveState();
    renderQuestion();
}

function startReviewMode() {
    showResult = false;
    isReviewMode = true;
    currentQuestion = 0;
    saveState();
    renderQuestion();
}

function exitReviewMode() {
    showResult = true;
    isReviewMode = false;
    saveState();
    renderQuestion();
}

function playBellSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 2.0);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 2.0);
    } catch (e) {
        console.error("Lỗi âm thanh Web Audio:", e);
    }
}

function updateTimerUI(seconds) {
    const bar = document.getElementById('timer-bar');
    const text = document.getElementById('timer-text');
    if (text) text.innerText = `${seconds}s`;
    if (bar) {
        const percentage = (seconds / 20) * 100;
        bar.style.width = `${percentage}%`;
        if (seconds <= 5) {
            bar.style.background = '#a61c1c';
        } else {
            bar.style.background = 'linear-gradient(90deg, var(--gold-accent), var(--incorrect))';
        }
    }
}

function startTimer() {
    clearInterval(timerInterval);
    if (isReviewMode || showResult) {
        return;
    }
    
    const currentAns = userAnswers[currentQuestion];
    if (currentAns !== null) {
        updateTimerUI(0);
        return;
    }
    
    timeLeft = 20;
    updateTimerUI(timeLeft);
    
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI(timeLeft);
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleTimeout();
        }
    }, 1000);
}

function handleTimeout() {
    isExplanationRevealed = false;
    userAnswers[currentQuestion] = -1;
    updateScore();
    saveState();
    playBellSound();
    renderQuestion();
}

function revealExplanation() {
    isExplanationRevealed = true;
    renderQuestion();
}

function restartQuiz() {
    clearInterval(timerInterval);
    localStorage.removeItem(STORAGE_KEY);
    currentQuestion = 0;
    score = 0;
    userAnswers = new Array(quizData.length).fill(null);
    showResult = false;
    isReviewMode = false;
    isExplanationRevealed = false;
    renderQuestion();
}

function renderQuestion() {
    if (showResult) {
        renderResultScreen();
        return;
    }

    const app = document.querySelector('.app-container');
    if (!app) return;

    const q = quizData[currentQuestion];
    if (!q) return;

    const selectedOption = userAnswers[currentQuestion];
    const isTimeout = selectedOption === -1;
    const isAnswered = (selectedOption !== null && selectedOption !== -1) || (isTimeout && isExplanationRevealed) || isReviewMode;
    const isDisabled = isAnswered || isTimeout;

    const optionsHtml = q.options.map((opt, idx) => {
        let btnClass = "option-btn";
        if (isAnswered) {
            if (idx === q.correct) {
                btnClass += " correct";
            } else if (selectedOption !== null && idx === selectedOption) {
                btnClass += " incorrect";
            }
        }
        return `<button class="${btnClass}" onclick="selectOption(${idx})" ${isDisabled ? 'disabled' : ''}>${String.fromCharCode(65 + idx)}. ${opt}</button>`;
    }).join('');

    let explanationHtml = '';
    if (isAnswered && q.explanation) {
        explanationHtml = `<div class="explanation"><strong>Giải thích:</strong> ${q.explanation}</div>`;
    }

    let reviewBannerHtml = '';
    if (isReviewMode) {
        reviewBannerHtml = `
            <div class="review-banner">
                <span>Đang ở chế độ ôn tập.</span>
                <button onclick="exitReviewMode()">Thoát Ôn Tập</button>
            </div>
        `;
    }

    const isLastQuestion = currentQuestion === quizData.length - 1;
    let nextBtnHtml = '';
    if (isLastQuestion) {
        nextBtnHtml = `<button class="nav-btn" onclick="finishQuiz()">Xem Kết Quả</button>`;
    } else {
        nextBtnHtml = `<button class="nav-btn" onclick="nextQuestion()">Câu tiếp</button>`;
    }

    let timerDisplayHtml = '';
    if (!isReviewMode) {
        timerDisplayHtml = `
            <div class="timer-display">
                <span>⏳</span>
                <span id="timer-text">20s</span>
            </div>
        `;
    }

    let timeoutOverlayHtml = '';
    if (isTimeout && !isExplanationRevealed) {
        timeoutOverlayHtml = `
            <div class="timeout-overlay">
                <div class="timeout-title">⏳ HẾT THỜI GIAN SUY NGHĨ</div>
                <button class="btn btn-primary" onclick="revealExplanation()">Kết quả</button>
            </div>
        `;
    }

    app.innerHTML = `
        ${reviewBannerHtml}
        <div class="header">
            <h1>Lời vàng thầy tôi - Phần 2</h1>
            <div class="progress-bar">
                <span>Câu ${currentQuestion + 1} / ${quizData.length}</span>
                ${timerDisplayHtml}
                <button class="map-toggle-btn" onclick="openQuizMap()">🗺️ Bản đồ câu hỏi</button>
                <span>Điểm: ${score}</span>
            </div>
            ${!isReviewMode ? `
            <div class="timer-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
            ` : ''}
        </div>
        <div class="question-card">
            <div class="level-badge level-${q.level}">${q.level ? q.level.toUpperCase() : ''}</div>
            <h2 class="question-title">${q.question}</h2>
            <div class="options-container">
                ${timeoutOverlayHtml}
                <div class="options-list">
                    ${optionsHtml}
                </div>
            </div>
            ${explanationHtml}
        </div>
        <div class="navigation">
            <button class="nav-btn" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>Câu trước</button>
            ${nextBtnHtml}
        </div>
    `;

    startTimer();
}

function selectOption(index) {
    if (isReviewMode || userAnswers[currentQuestion] !== null) return;
    clearInterval(timerInterval);
    userAnswers[currentQuestion] = index;
    updateScore();
    saveState();
    renderQuestion();
}

function nextQuestion() {
    if (currentQuestion < quizData.length - 1) {
        isExplanationRevealed = false;
        currentQuestion++;
        saveState();
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        isExplanationRevealed = false;
        currentQuestion--;
        saveState();
        renderQuestion();
    }
}

function confirmResume(shouldResume) {
    const modal = document.getElementById('resume-modal');
    if (modal) modal.style.display = 'none';

    clearInterval(timerInterval);
    isExplanationRevealed = false;

    if (shouldResume && savedStateTemp) {
        currentQuestion = typeof savedStateTemp.currentQuestion === 'number' ? savedStateTemp.currentQuestion : 0;
        userAnswers = Array.isArray(savedStateTemp.userAnswers) ? savedStateTemp.userAnswers : new Array(quizData.length).fill(null);
        showResult = !!savedStateTemp.showResult;
        isReviewMode = !!savedStateTemp.isReviewMode;
        updateScore();
    } else {
        localStorage.removeItem(STORAGE_KEY);
        currentQuestion = 0;
        score = 0;
        userAnswers = new Array(quizData.length).fill(null);
        showResult = false;
        isReviewMode = false;
    }
    savedStateTemp = null;
    renderQuestion();
}

function openQuizMap() {
    const modal = document.getElementById('quiz-map-modal');
    const grid = document.getElementById('quiz-map-grid');
    if (!modal || !grid) return;

    grid.innerHTML = quizData.map((_, idx) => {
        let statusClass = 'unanswered';
        const ans = userAnswers[idx];
        if (ans !== null) {
            statusClass = (ans === quizData[idx].correct) ? 'correct' : 'incorrect';
        }
        if (idx === currentQuestion) {
            statusClass += ' current';
        }
        return `<button class="grid-item ${statusClass}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
    }).join('');

    modal.style.display = 'flex';
}

function closeQuizMap() {
    const modal = document.getElementById('quiz-map-modal');
    if (modal) modal.style.display = 'none';
}

function closeQuizMapOnBackdrop(event) {
    if (event.target.id === 'quiz-map-modal') {
        closeQuizMap();
    }
}

function jumpToQuestion(index) {
    if (index >= 0 && index < quizData.length) {
        isExplanationRevealed = false;
        currentQuestion = index;
        saveState();
        closeQuizMap();
        renderQuestion();
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeQuizMap();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    renderQuestion();
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.userAnswers) && parsed.userAnswers.length === quizData.length) {
                const hasProgress = parsed.userAnswers.some(ans => ans !== null) || (parsed.currentQuestion > 0);
                if (hasProgress) {
                    savedStateTemp = parsed;
                    const modal = document.getElementById('resume-modal');
                    if (modal) {
                        modal.style.display = 'flex';
                    }
                }
            }
        } catch (e) {
            console.error("Lỗi đọc LocalStorage:", e);
            localStorage.removeItem(STORAGE_KEY);
        }
    }
});
    </script>
</body>
